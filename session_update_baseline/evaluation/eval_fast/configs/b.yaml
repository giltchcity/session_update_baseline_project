ground_truth_dsg_file: /home/jixian/Desktop/FT/results/current_version_20260921/real_abc/objects/gt_b_latest/gt_dsg_consolidated.sparkdsg
ground_truth_background_file: /home/jixian/Desktop/FT/results/current_version_20260921/real_abc/objects/gt_b_latest/unused_background_not_evaluated.ply
only_evaluate_final_map: false
save_reconciled_dsg: true
store_visualization_details: true
change_detection:
- name: common
  ray_verificator:
    verbosity: 0
    block_size: 0.5
    radial_tolerance: 0.08
    depth_tolerance: 0.5
    ray_policy: Middle
    active_window_duration: 3.0
  ray_change_detector:
    temporal_resolution: 5.0
    window_size: 5
    use_relative_confidence: true
    absence_confidence: 0.5
    presence_confidence: 0.5
  objects:
    type: RayObjectChangeDetector
    time_filtering_threshold: 10.0
- name: M36
  ray_verificator:
    ray_policy: Middle
    depth_tolerance: 0.3
  ray_change_detector:
    absence_confidence: 0.6
reconciliation:
- name: common
  verbosity: 0
  mesh_merger:
    type: change
    remove_objects_from_background: true
    object_proximity_threshold: 0.05
  time_estimates_conservative: false
- name: Optimistic
  time_estimates_conservative: false
evaluation:
  evaluate_mesh: false
  evaluate_objects: true
  evaluate_dynamic_objects: false
  mesh_evaluation:
    thresholds:
    - 0.05
    - 0.1
    - 0.2
    - 0.5
  object_evaluation:
    verbosity: 0
    match_require_semantics: true
    compensate_missegmentation: false
    max_matching_distance: 0.5
    association_method: Surface
    surface_subsampling_rate: 100
  dynamic_object_evaluation:
    verbosity: 0
    compensate_missegmentation: true
    max_matching_distance: 0.5

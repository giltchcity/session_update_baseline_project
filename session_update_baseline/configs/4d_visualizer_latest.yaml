# Khronos 4D viewer preset for inspecting a completed saved map.
dynamic_config:
  background_color: 0
  object_bbox_color: Presence
  dynamic_object_color: ID
  play_rate: 1.0
  fade_duration: 0.0

# Percentages of the saved map time range: 1 means the latest/final state.
initial_robot_time: 1
initial_query_time: 1
initial_time_mode: Online
max_frame_rate: 30

gui:
  query_time_unit: s
  robot_time_unit: s

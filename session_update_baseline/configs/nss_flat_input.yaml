---
type: RosInput
tf_verbosity: 1
clear_queue_on_fail: true
# The datasets are 30 Hz (minimum measured spacing 0.0333 s). 0.04 s would
# reject every second frame and make per-frame ACK wait forever. Keep one
# outstanding packet because the player already provides deterministic
# backpressure.
max_receiver_queue_size: 1
inputs:
  left_cam:
    receiver:
      type: ClosedSetImageReceiver
      input_separation_s: 0.02
      queue_size: 1
    sensor:
      type: camera_info
      min_range: $(var sensor_min_range)
      max_range: $(var sensor_max_range)
      extrinsics:
        type: ros
        sensor_frame: left_cam
